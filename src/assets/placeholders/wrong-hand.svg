<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#f1c27d"/>
    </linearGradient>
    <filter id="bigRed">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#fef5e7" rx="20"/>
  <!-- 手腕 -->
  <rect x="200" y="380" width="100" height="100" rx="20" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 手掌 -->
  <ellipse cx="250" cy="340" rx="100" ry="80" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 6根手指（故意画6根，突出AI犯错） -->
  <!-- 大拇指 -->
  <ellipse cx="148" cy="320" rx="22" ry="55" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3" transform="rotate(-30 148 320)"/>
  <!-- 食指 -->
  <rect x="175" y="170" width="30" height="130" rx="15" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 中指 -->
  <rect x="215" y="150" width="30" height="150" rx="15" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 无名指 -->
  <rect x="255" y="160" width="30" height="140" rx="15" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 小指 -->
  <rect x="295" y="180" width="30" height="120" rx="15" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 第六根手指！（多出来的） -->
  <rect x="335" y="210" width="28" height="100" rx="14" fill="url(#skinGrad)" stroke="#c68642" stroke-width="3"/>
  <!-- 红色圈+箭头指向多的手指 -->
  <circle cx="349" cy="245" r="42" fill="none" stroke="#f44336" stroke-width="5" stroke-dasharray="8,4" filter="url(#bigRed)"/>
  <text x="399" y="195" font-size="34" fill="#f44336" font-weight="900">?</text>
  <!-- 关节纹理 -->
  <g stroke="#c68642" stroke-width="2" fill="none" opacity="0.5">
    <line x1="190" y1="225" x2="205" y2="225"/>
    <line x1="230" y1="210" x2="245" y2="210"/>
    <line x1="270" y1="215" x2="285" y2="215"/>
    <line x1="310" y1="230" x2="325" y2="230"/>
  </g>
  <!-- 底部提示数字 -->
  <g fill="#f44336" font-weight="900" font-size="38">
    <text x="180" y="160">1</text>
    <text x="220" y="140">2</text>
    <text x="260" y="150">3</text>
    <text x="300" y="170">4</text>
    <text x="340" y="200">5</text>
    <text x="370" y="220">6?</text>
  </g>
</svg>
