<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#000428"/>
    </radialGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c8d8"/>
    </linearGradient>
    <radialGradient id="helmet">
      <stop offset="0%" stop-color="rgba(100,200,255,0.6)"/>
      <stop offset="70%" stop-color="rgba(50,100,200,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)"/>
    </radialGradient>
  </defs>
  <!-- 太空背景 -->
  <rect width="500" height="500" fill="url(#spaceBg)"/>
  <!-- 星星 -->
  <g fill="#fff">
    <circle cx="60" cy="80" r="2"/>
    <circle cx="430" cy="120" r="3"/>
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="470" cy="280" r="2"/>
    <circle cx="40" cy="350" r="2"/>
    <circle cx="380" cy="420" r="1.5"/>
    <circle cx="200" cy="60" r="1"/>
    <circle cx="300" cy="90" r="2"/>
    <circle cx="90" cy="450" r="1.5"/>
  </g>
  <!-- 地球（背景） -->
  <circle cx="420" cy="440" r="80" fill="#4fc3f7" opacity="0.8"/>
  <ellipse cx="400" cy="420" rx="25" ry="10" fill="#66bb6a" opacity="0.9"/>
  <ellipse cx="440" cy="460" rx="20" ry="8" fill="#66bb6a" opacity="0.9"/>
  <!-- 宇航服身体 -->
  <ellipse cx="250" cy="360" rx="110" ry="100" fill="url(#suit)" stroke="#8a97b8" stroke-width="3"/>
  <!-- 手臂 -->
  <ellipse cx="160" cy="340" rx="30" ry="60" fill="url(#suit)" stroke="#8a97b8" stroke-width="3" transform="rotate(-20 160 340)"/>
  <ellipse cx="340" cy="340" rx="30" ry="60" fill="url(#suit)" stroke="#8a97b8" stroke-width="3" transform="rotate(20 340 340)"/>
  <!-- 胸前国旗/标识 -->
  <rect x="225" y="340" width="50" height="35" rx="4" fill="#ff5252"/>
  <text x="250" y="362" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">喵太空</text>
  <!-- 头盔（圆形玻璃） -->
  <circle cx="250" cy="220" r="105" fill="url(#helmet)" stroke="#fff" stroke-width="4"/>
  <!-- 猫头（头盔内） -->
  <ellipse cx="250" cy="230" rx="65" ry="60" fill="#ff9a3c"/>
  <!-- 猫耳朵 -->
  <path d="M 200 180 L 190 145 L 225 170 Z" fill="#ff9a3c" stroke="#e07020" stroke-width="2"/>
  <path d="M 300 180 L 310 145 L 275 170 Z" fill="#ff9a3c" stroke="#e07020" stroke-width="2"/>
  <path d="M 202 175 L 197 158 L 216 170 Z" fill="#ff6f91"/>
  <path d="M 298 175 L 303 158 L 284 170 Z" fill="#ff6f91"/>
  <!-- 猫眼睛（大大的萌猫眼） -->
  <ellipse cx="225" cy="225" rx="14" ry="18" fill="#fff"/>
  <ellipse cx="275" cy="225" rx="14" ry="18" fill="#fff"/>
  <ellipse cx="225" cy="228" rx="8" ry="14" fill="#2e7d32"/>
  <ellipse cx="275" cy="228" rx="8" ry="14" fill="#2e7d32"/>
  <ellipse cx="225" cy="225" rx="3" ry="8" fill="#000"/>
  <ellipse cx="275" cy="225" rx="3" ry="8" fill="#000"/>
  <circle cx="228" cy="220" r="2.5" fill="#fff"/>
  <circle cx="278" cy="220" r="2.5" fill="#fff"/>
  <!-- 鼻子 -->
  <path d="M 245 250 L 255 250 L 250 258 Z" fill="#ff4081"/>
  <!-- 嘴 -->
  <path d="M 250 258 Q 242 268 235 263" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 250 258 Q 258 268 265 263" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 胡须 -->
  <g stroke="#333" stroke-width="1.5" stroke-linecap="round">
    <line x1="205" y1="250" x2="180" y2="247"/>
    <line x1="205" y1="255" x2="178" y2="258"/>
    <line x1="295" y1="250" x2="320" y2="247"/>
    <line x1="295" y1="255" x2="322" y2="258"/>
  </g>
  <!-- 头盔反光高光 -->
  <ellipse cx="215" cy="180" rx="25" ry="18" fill="#fff" opacity="0.4"/>
</svg>
