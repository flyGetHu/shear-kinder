<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="oldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="400" fill="none"/>
  <!-- 天线 -->
  <line x1="200" y1="60" x2="200" y2="100" stroke="#333" stroke-width="4"/>
  <circle cx="200" cy="55" r="8" fill="#f44336"/>
  <!-- 头部（方方正正） -->
  <rect x="130" y="100" width="140" height="110" fill="url(#oldBody)" stroke="#212121" stroke-width="4"/>
  <!-- 螺丝 -->
  <circle cx="140" cy="110" r="4" fill="#424242"/>
  <circle cx="260" cy="110" r="4" fill="#424242"/>
  <circle cx="140" cy="200" r="4" fill="#424242"/>
  <circle cx="260" cy="200" r="4" fill="#424242"/>
  <!-- 眼睛（红色方块，呆板） -->
  <rect x="155" y="135" width="30" height="20" fill="#f44336"/>
  <rect x="215" y="135" width="30" height="20" fill="#f44336"/>
  <!-- 嘴（一字型） -->
  <rect x="160" y="175" width="80" height="6" fill="#212121"/>
  <!-- 身体 -->
  <rect x="145" y="210" width="110" height="110" fill="url(#oldBody)" stroke="#212121" stroke-width="4"/>
  <!-- 按钮 -->
  <circle cx="175" cy="245" r="8" fill="#f44336"/>
  <circle cx="200" cy="245" r="8" fill="#ffc107"/>
  <circle cx="225" cy="245" r="8" fill="#4caf50"/>
  <!-- 仪表 -->
  <rect x="170" y="270" width="60" height="30" fill="#263238" stroke="#455a64" stroke-width="2"/>
  <text x="200" y="292" text-anchor="middle" font-size="14" fill="#4fc3f7" font-family="monospace">01010</text>
  <!-- 手臂 -->
  <rect x="95" y="220" width="30" height="90" fill="url(#oldBody)" stroke="#212121" stroke-width="3"/>
  <rect x="275" y="220" width="30" height="90" fill="url(#oldBody)" stroke="#212121" stroke-width="3"/>
  <!-- 手（方块） -->
  <rect x="88" y="310" width="44" height="30" fill="#616161" stroke="#212121" stroke-width="3"/>
  <rect x="268" y="310" width="44" height="30" fill="#616161" stroke="#212121" stroke-width="3"/>
  <!-- 腿 -->
  <rect x="160" y="320" width="25" height="50" fill="url(#oldBody)" stroke="#212121" stroke-width="3"/>
  <rect x="215" y="320" width="25" height="50" fill="url(#oldBody)" stroke="#212121" stroke-width="3"/>
  <!-- 脚 -->
  <rect x="150" y="370" width="45" height="15" fill="#424242" stroke="#212121" stroke-width="3"/>
  <rect x="205" y="370" width="45" height="15" fill="#424242" stroke="#212121" stroke-width="3"/>
</svg>
