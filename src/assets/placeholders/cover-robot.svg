<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#b8c6ff"/>
      <stop offset="100%" stop-color="#6b7fe0"/>
    </radialGradient>
    <radialGradient id="eyeGrad">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 天线 -->
  <line x1="250" y1="80" x2="250" y2="130" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="250" cy="70" r="14" fill="#ffdd44" filter="url(#glow)"/>
  <!-- 头 -->
  <rect x="150" y="130" width="200" height="170" rx="40" fill="url(#bodyGrad)" stroke="#fff" stroke-width="4"/>
  <!-- 眼睛 -->
  <circle cx="205" cy="210" r="28" fill="#1a1a3e"/>
  <circle cx="295" cy="210" r="28" fill="#1a1a3e"/>
  <circle cx="205" cy="210" r="20" fill="url(#eyeGrad)"/>
  <circle cx="295" cy="210" r="20" fill="url(#eyeGrad)"/>
  <circle cx="212" cy="203" r="6" fill="#fff"/>
  <circle cx="302" cy="203" r="6" fill="#fff"/>
  <!-- 嘴巴（微笑） -->
  <path d="M 210 260 Q 250 285 290 260" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="175" cy="245" r="12" fill="#ff9ebe" opacity="0.7"/>
  <circle cx="325" cy="245" r="12" fill="#ff9ebe" opacity="0.7"/>
  <!-- 身体 -->
  <rect x="175" y="310" width="150" height="130" rx="30" fill="url(#bodyGrad)" stroke="#fff" stroke-width="4"/>
  <!-- 胸口爱心 -->
  <path d="M 250 350 L 235 335 Q 220 325 230 345 L 250 370 L 270 345 Q 280 325 265 335 Z" fill="#ff5e8a" filter="url(#glow)"/>
  <!-- 手臂 -->
  <rect x="120" y="330" width="45" height="90" rx="22" fill="url(#bodyGrad)" stroke="#fff" stroke-width="4"/>
  <rect x="335" y="330" width="45" height="90" rx="22" fill="url(#bodyGrad)" stroke="#fff" stroke-width="4"/>
  <!-- 星星装饰 -->
  <g fill="#ffeb3b" filter="url(#glow)">
    <path d="M 80 130 l 6 18 l 18 2 l -14 12 l 4 18 l -14 -10 l -14 10 l 4 -18 l -14 -12 l 18 -2 z"/>
    <path d="M 420 100 l 4 12 l 12 2 l -10 8 l 3 12 l -9 -7 l -9 7 l 3 -12 l -10 -8 l 12 -2 z"/>
    <path d="M 430 380 l 5 14 l 14 2 l -11 10 l 3 14 l -11 -8 l -11 8 l 3 -14 l -11 -10 l 14 -2 z"/>
    <path d="M 70 400 l 4 12 l 12 2 l -10 8 l 3 12 l -9 -7 l -9 7 l 3 -12 l -10 -8 l 12 -2 z"/>
  </g>
</svg>
