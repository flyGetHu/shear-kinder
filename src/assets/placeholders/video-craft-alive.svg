<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="craftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#craftBg)"/>
  <!-- 手工画中的小人（主角） -->
  <g transform="translate(300, 130)">
    <!-- 身体 -->
    <rect x="50" y="120" width="100" height="120" rx="15" fill="#64b5f6" stroke="#1565c0" stroke-width="4"/>
    <!-- 头 -->
    <circle cx="100" cy="80" r="55" fill="#ffcc80" stroke="#e65100" stroke-width="4"/>
    <!-- 头发 -->
    <path d="M 45 70 Q 50 25 100 22 Q 150 25 155 70 Q 140 55 100 55 Q 60 55 45 70 Z" fill="#5d4037"/>
    <!-- 眼睛（大大的卡通眼） -->
    <circle cx="82" cy="80" r="10" fill="#fff"/>
    <circle cx="118" cy="80" r="10" fill="#fff"/>
    <circle cx="84" cy="82" r="6" fill="#000"/>
    <circle cx="120" cy="82" r="6" fill="#000"/>
    <circle cx="86" cy="79" r="2" fill="#fff"/>
    <circle cx="122" cy="79" r="2" fill="#fff"/>
    <!-- 笑脸 -->
    <path d="M 80 100 Q 100 118 120 100" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <circle cx="70" cy="95" r="6" fill="#ffab91" opacity="0.8"/>
    <circle cx="130" cy="95" r="6" fill="#ffab91" opacity="0.8"/>
    <!-- 手（挥手） -->
    <ellipse cx="25" cy="150" rx="18" ry="22" fill="#ffcc80" stroke="#e65100" stroke-width="3"/>
    <ellipse cx="175" cy="160" rx="18" ry="22" fill="#ffcc80" stroke="#e65100" stroke-width="3"/>
    <!-- 腿 -->
    <rect x="68" y="235" width="25" height="50" rx="10" fill="#1976d2" stroke="#0d47a1" stroke-width="3"/>
    <rect x="107" y="235" width="25" height="50" rx="10" fill="#1976d2" stroke="#0d47a1" stroke-width="3"/>
  </g>
  <!-- 魔法星星闪光（四周） -->
  <g fill="#fff176" filter="url(#sparkleGlow)">
    <path d="M 100 100 l 6 18 l 18 2 l -14 12 l 4 18 l -14 -10 l -14 10 l 4 -18 l -14 -12 l 18 -2 z"/>
    <path d="M 680 80 l 5 14 l 14 2 l -11 10 l 3 14 l -11 -8 l -11 8 l 3 -14 l -11 -10 l 14 -2 z"/>
    <path d="M 720 300 l 4 12 l 12 2 l -10 8 l 3 12 l -9 -7 l -9 7 l 3 -12 l -10 -8 l 12 -2 z"/>
    <path d="M 80 330 l 5 14 l 14 2 l -11 10 l 3 14 l -11 -8 l -11 8 l 3 -14 l -11 -10 l 14 -2 z"/>
  </g>
  <!-- 魔法圆圈（围绕小人） -->
  <g fill="none" stroke="#fff" stroke-width="3" opacity="0.5">
    <circle cx="400" cy="265" r="200" stroke-dasharray="10,15"/>
    <circle cx="400" cy="265" r="240" stroke-dasharray="5,10"/>
  </g>
  <!-- 播放按钮 -->
  <circle cx="400" cy="265" r="55" fill="rgba(255,255,255,0.95)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
  <polygon points="385,240 385,290 430,265" fill="#ff5722"/>
  <!-- 标题 -->
  <text x="400" y="50" text-anchor="middle" font-size="36" fill="#fff" font-weight="900" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">手工 活 过 来 了！</text>
  <text x="400" y="80" text-anchor="middle" font-size="20" fill="#fff" opacity="0.95">AI 让小朋友的画动起来</text>
</svg>
