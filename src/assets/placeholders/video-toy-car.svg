<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a8b"/>
      <stop offset="100%" stop-color="#ff6a88"/>
    </linearGradient>
    <radialGradient id="wheel">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vidBg)"/>
  <!-- 道路 -->
  <rect x="0" y="330" width="800" height="120" fill="#424242"/>
  <g stroke="#fff" stroke-width="5" stroke-dasharray="30,20">
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>
  <!-- 玩具小车（左，虚化） -->
  <g opacity="0.6" transform="translate(150, 180)">
    <rect x="0" y="40" width="140" height="55" rx="12" fill="#ffeb3b" stroke="#f57f17" stroke-width="3"/>
    <rect x="25" y="15" width="90" height="35" rx="8" fill="#ffd54f" stroke="#f57f17" stroke-width="3"/>
    <circle cx="35" cy="100" r="16" fill="url(#wheel)"/>
    <circle cx="105" cy="100" r="16" fill="url(#wheel)"/>
    <text x="70" y="45" text-anchor="middle" font-size="18" fill="#5d4037">玩具</text>
  </g>
  <!-- 箭头 -->
  <g fill="#fff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">
    <polygon points="330,260 380,260 380,240 420,280 380,320 380,300 330,300"/>
  </g>
  <!-- 真车（右） -->
  <g transform="translate(440, 200)">
    <rect x="0" y="50" width="220" height="70" rx="15" fill="#d32f2f" stroke="#b71c1c" stroke-width="3"/>
    <path d="M 30 50 L 60 10 L 170 10 L 200 50 Z" fill="#e57373" stroke="#b71c1c" stroke-width="3"/>
    <rect x="65" y="15" width="35" height="30" fill="#b3e5fc" opacity="0.8"/>
    <rect x="120" y="15" width="35" height="30" fill="#b3e5fc" opacity="0.8"/>
    <circle cx="50" cy="125" r="25" fill="url(#wheel)" stroke="#000" stroke-width="3"/>
    <circle cx="170" cy="125" r="25" fill="url(#wheel)" stroke="#000" stroke-width="3"/>
    <circle cx="50" cy="125" r="10" fill="#888"/>
    <circle cx="170" cy="125" r="10" fill="#888"/>
    <circle cx="10" cy="80" r="6" fill="#fff59d"/>
    <circle cx="210" cy="80" r="5" fill="#ef5350"/>
  </g>
  <!-- 速度线 -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="680" y1="270" x2="760" y2="270"/>
    <line x1="690" y1="290" x2="770" y2="290"/>
    <line x1="680" y1="310" x2="760" y2="310"/>
  </g>
  <!-- 播放按钮 -->
  <circle cx="400" cy="225" r="55" fill="rgba(255,255,255,0.9)"/>
  <polygon points="385,200 385,250 430,225" fill="#ff6a88"/>
  <!-- 标题 -->
  <text x="400" y="60" text-anchor="middle" font-size="34" fill="#fff" font-weight="900">玩具 → 真汽车</text>
  <text x="400" y="90" text-anchor="middle" font-size="18" fill="#fff" opacity="0.9">AI让玩具活过来</text>
</svg>
