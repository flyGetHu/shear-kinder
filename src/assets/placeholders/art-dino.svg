<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#fff9c4" rx="20"/>
  <!-- 太阳 -->
  <circle cx="250" cy="60" r="25" fill="#ffca28"/>
  <g stroke="#ffca28" stroke-width="3" stroke-linecap="round">
    <line x1="250" y1="20" x2="250" y2="30"/>
    <line x1="250" y1="90" x2="250" y2="100"/>
    <line x1="210" y1="60" x2="220" y2="60"/>
    <line x1="280" y1="60" x2="290" y2="60"/>
  </g>
  <!-- 草地 -->
  <rect x="0" y="220" width="300" height="80" fill="#8bc34a"/>
  <!-- 恐龙身体 -->
  <ellipse cx="130" cy="195" rx="80" ry="45" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
  <!-- 尾巴 -->
  <path d="M 50 190 Q 10 180 20 210" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
  <!-- 脖子+头 -->
  <path d="M 180 190 Q 220 120 240 130 Q 260 145 245 170 L 215 180 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
  <!-- 眼睛 -->
  <circle cx="235" cy="145" r="4" fill="#fff"/>
  <circle cx="236" cy="146" r="2" fill="#000"/>
  <!-- 腿 -->
  <rect x="85" y="225" width="18" height="30" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
  <rect x="160" y="225" width="18" height="30" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
  <!-- 背上尖刺 -->
  <g fill="#ff7043" stroke="#d84315" stroke-width="2">
    <polygon points="90,155 100,140 110,155"/>
    <polygon points="120,148 132,132 144,148"/>
    <polygon points="155,150 168,135 180,150"/>
  </g>
  <!-- 花朵 -->
  <g>
    <circle cx="50" cy="250" r="8" fill="#ec407a"/>
    <circle cx="50" cy="250" r="3" fill="#fff9c4"/>
    <circle cx="270" cy="245" r="7" fill="#ab47bc"/>
    <circle cx="270" cy="245" r="3" fill="#fff9c4"/>
  </g>
</svg>
