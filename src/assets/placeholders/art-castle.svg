<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffccbc"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#skyGrad)" rx="20"/>
  <!-- 云朵 -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="80" cy="230" rx="45" ry="18"/>
    <ellipse cx="120" cy="225" rx="30" ry="15"/>
    <ellipse cx="220" cy="240" rx="50" ry="20"/>
  </g>
  <!-- 城堡主楼 -->
  <rect x="110" y="100" width="80" height="130" fill="#b39ddb" stroke="#5e35b1" stroke-width="3"/>
  <!-- 塔顶 -->
  <polygon points="110,100 150,50 190,100" fill="#ec407a" stroke="#ad1457" stroke-width="3"/>
  <!-- 左塔 -->
  <rect x="70" y="140" width="40" height="90" fill="#b39ddb" stroke="#5e35b1" stroke-width="3"/>
  <polygon points="70,140 90,100 110,140" fill="#ec407a" stroke="#ad1457" stroke-width="3"/>
  <!-- 右塔 -->
  <rect x="190" y="140" width="40" height="90" fill="#b39ddb" stroke="#5e35b1" stroke-width="3"/>
  <polygon points="190,140 210,100 230,140" fill="#ec407a" stroke="#ad1457" stroke-width="3"/>
  <!-- 旗子 -->
  <line x1="150" y1="50" x2="150" y2="30" stroke="#333" stroke-width="2"/>
  <polygon points="150,30 170,38 150,45" fill="#ffeb3b"/>
  <!-- 窗户 -->
  <rect x="135" y="130" width="15" height="22" fill="#1a237e" rx="3"/>
  <rect x="150" y="130" width="15" height="22" fill="#1a237e" rx="3"/>
  <rect x="82" y="160" width="16" height="18" fill="#1a237e" rx="2"/>
  <rect x="202" y="160" width="16" height="18" fill="#1a237e" rx="2"/>
  <!-- 大门 -->
  <path d="M 130 230 L 130 195 Q 150 180 170 195 L 170 230 Z" fill="#6d4c41" stroke="#3e2723" stroke-width="2"/>
  <!-- 星星 -->
  <g fill="#ffeb3b">
    <polygon points="40,60 44,72 56,72 46,80 50,92 40,84 30,92 34,80 24,72 36,72"/>
    <polygon points="250,80 253,89 262,89 255,95 258,104 250,99 242,104 245,95 238,89 247,89"/>
  </g>
</svg>
